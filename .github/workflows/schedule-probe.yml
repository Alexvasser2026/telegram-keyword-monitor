name: GitHub schedule diagnostic

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print schedule diagnostic
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule }}"
          echo "Runner UTC time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Probe workflow started successfully."
